name: Sparkle check

# Sparkle installs every update, so its fixes are security fixes. Once a week,
# compare the pinned version with Sparkle's latest release and open an issue
# when they differ (once per version).
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(jq -r '.pins[] | select(.identity == "sparkle") | .state.version' \
            Superkeys.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
          latest=$(gh api repos/sparkle-project/Sparkle/releases/latest --jq .tag_name)
          echo "pinned $pinned, latest $latest"
          [ "$pinned" = "$latest" ] && exit 0
          title="Update Sparkle to $latest"
          if gh issue list --state all --search "\"$title\" in:title" --json number --jq length | grep -qv '^0$'; then
            echo "issue already exists"; exit 0
          fi
          gh issue create --title "$title" --label dependencies --body "Superkeys pins Sparkle $pinned; [$latest](https://github.com/sparkle-project/Sparkle/releases/tag/$latest) is out. Read its notes for security fixes, update the package in Xcode (File → Packages → Update to Latest Package Versions, or bump the requirement in \`scripts/generate_project.py\`), run the tests, and release."
